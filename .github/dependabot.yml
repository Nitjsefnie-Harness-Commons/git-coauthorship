# Every dependency is pinned exactly, so a release never reds an unchanged
# commit; Dependabot keeps the pins from going stale (a fixed CVE stays
# exploitable), which audit.yml can only detect.

version: 2
updates:
  # The toolchain pins; the package itself is stdlib-only.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # `include: scope` adds the classification. A requirements file whose
    # name contains "dev" counts as development: requirements-dev.txt bumps
    # read `ci(deps-dev): ...`, requirements-test.txt bumps `ci(deps): ...`.
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies

  # Actions are SHA-pinned (jobs hold a repository token); without
  # Dependabot those pins never move.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
    # codeql-action's `init` and `analyze` must move together, or `analyze`
    # fails. A group covers version updates only unless it names
    # `applies-to`, so security updates get a group of their own.
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
