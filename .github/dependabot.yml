# Every dependency in this repo is pinned to an exact version, deliberately:
# a tool or library release must never turn CI red on an unchanged commit.
# The cost of that choice is that pins go stale silently, and a stale pin is
# how a fixed CVE stays exploitable. Dependabot pays that cost back — it is
# the counterpart to audit.yml, which detects the problem but cannot fix it.
#
# Note the interaction with the repo's CI policy: PRs are not built until an
# approving review lands (see tests.yml), so a Dependabot PR sits unbuilt
# until a human looks at it. That is the existing policy working as intended,
# not an extra cost of enabling this — an unreviewed bump is exactly the kind
# of change that should not get a runner.
#
# There is no npm entry: this repo has no JavaScript at all.

version: 2
updates:
  # requirements-dev.txt (lint/type toolchain) and requirements-test.txt
  # (coverage). There is no runtime entry: the distributed package is
  # stdlib-only on purpose, so these tool pins are the entire pip surface.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Dependabot writes its own commit messages, so the Conventional Commits
    # type only holds for them if it is configured here. `include: scope`
    # appends the dependency's classification, which is not a constant: a
    # requirements file whose name contains "dev" counts as development, so
    # requirements-dev.txt bumps read `ci(deps-dev): ...` and
    # requirements-test.txt bumps read `ci(deps): ...`. Without
    # `prefix-development` the type stays `ci` for both.
    commit-message:
      prefix: ci
      include: scope

  # The workflows pin every action to a commit SHA with the version in a
  # trailing comment. A SHA pin does not move at all — which is the point,
  # since these jobs run with a repository token — and it is also why this
  # entry is not optional: without Dependabot a SHA pin is simply frozen
  # forever. It rewrites both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    # One pull request for every action bump. github/codeql-action ships
    # `init` and `analyze` as separate dependencies that must stay on one
    # version: `analyze` fails when its version differs from `init`'s, so a
    # pull request bumping either alone can never go green. A group covers
    # version updates only unless it names `applies-to`, and security updates
    # are enabled here, so they get a group of their own.
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
