# Every dependency is pinned exactly, so a release never reds an unchanged
# commit; Dependabot keeps the pins from going stale (a fixed CVE stays
# exploitable), which audit.yml can only detect.

version: 2
updates:
  # The toolchain pins; the package itself is stdlib-only.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # `include: scope` adds the classification: `ci(deps-dev): ...` only
    # when every bump is in requirements-dev.txt ("dev" in the name).
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
    # Bumps are checked only against the Python version, so pins that move
    # together share one pull request. A group cannot lift a parent's bound
    # (pylint's isort<10 refuses isort 10): regenerate with the manifest
    # header's command.
    groups:
      version-updates:
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Actions are SHA-pinned (jobs hold a repository token); without
  # Dependabot those pins never move.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
    # codeql-action's `init` and `analyze` must move together, or `analyze`
    # fails. A group covers version updates only unless it names
    # `applies-to`, so security updates get a group of their own.
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  # The perf image's digest. A bump changes the counted toolchain: when the
  # image builds, its pull request passes once a rebaseline commit is added;
  # a base with a libc6 newer than its own snapshot fails the build (apt exit
  # 100) and needs a newer base or a hand fix. 3.13 stays the line.
  - package-ecosystem: docker
    directory: "/.github/perf"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
