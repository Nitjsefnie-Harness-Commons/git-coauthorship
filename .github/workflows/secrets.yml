name: secrets

# Daily rescan of every branch's history; the actionlint job is the gate.

on:
  schedule:
    - cron: '29 5 * * *'

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download gitleaks and verify its digest
        # Bump with actionlint.yml's copy.
        run: |
          tarball=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${tarball}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks

      - name: Scan the history for secrets
        run: ./gitleaks detect --verbose --redact
