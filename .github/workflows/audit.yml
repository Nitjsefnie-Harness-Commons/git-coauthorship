name: audit

# Dependency vulnerability gate: pip-audit checks every version each
# requirements manifest pins against the PyPI advisory database.
#
# There is NO backend/requirements.txt here: the runtime is pure stdlib,
# with zero third-party imports. So this gate covers the toolchain — every
# CI tool's manifest — which is a smaller surface than the sibling repos
# have but not an empty one: those tools run in CI with the repository
# token, and a compromised one is a supply-chain problem even though it
# never ships.
#
# Each manifest pins its tool's full transitive tree: a linter drags in a
# dependency tree of its own, and that is where an advisory lands.
#
# WHY THE CRON IS THE IMPORTANT TRIGGER. Every other gate in this repo
# answers "did this commit break something", so push is the natural trigger.
# This one answers "is a version we froze months ago still safe", and that
# answer changes when a stranger publishes an advisory, with no commit here
# to hang it on. A push-only audit would report clean forever on an
# abandoned branch. The push trigger is the lesser half: it catches a bad
# pin at the moment it is introduced, while the diff is on screen.
#
# This gate FAILS the build rather than filing an advisory, which is the
# same stance as lint and types: a red gate that a human must look at beats
# a notification that accumulates unread. When a fix genuinely is not
# available yet, add the advisory to --ignore-vuln below WITH a comment
# saying why and what would clear it — never silence the whole gate.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  schedule:
    - cron: '12 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency
          # pulls in — reuse it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-audit.txt

      - name: Install pip-audit
        run: python -m pip install --require-hashes -r requirements-audit.txt

      - name: Audit dependencies
        # One invocation per manifest, as CI installs them. --disable-pip
        # audits the hashed pins as written; resolving them instead audits
        # only what pip adds to a scratch venv it first upgrades, so a pin
        # that venv already holds (setuptools, packaging) goes unaudited.
        #
        # No --ignore-vuln entries at present. Each one added here must
        # carry a comment naming the advisory, why it is not fixable, and
        # what would let it be removed.
        #
        # THE RETRY IS NARROW ON PURPOSE. pip-audit queries the advisory
        # database over the network, and a reset connection produces the
        # same exit status as a real finding. A blanket `retry 3` would
        # therefore re-run a genuine vulnerability three times before
        # reporting it, and — worse — a gate that goes red for reasons
        # unrelated to its subject is one people learn to ignore. So this
        # retries ONLY when the output carries a transport error, and
        # reports anything else immediately and verbatim.
        run: |
          shopt -s nullglob
          manifests=(requirements*.txt)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "no requirements manifest found — refusing to report a clean audit" >&2
            exit 1
          fi

          for manifest in "${manifests[@]}"; do
            for attempt in 1 2 3; do
              if pip-audit \
                   --progress-spinner off \
                   --disable-pip \
                   --require-hashes \
                   --requirement "$manifest" \
                   > audit.out 2>&1; then
                cat audit.out
                continue 2
              fi

              if grep -qiE 'connection (aborted|reset|error)|read timed out|temporary failure in name resolution' audit.out; then
                echo "$manifest attempt $attempt: transport failure talking to PyPI, retrying"
                tail -n 5 audit.out
                sleep $(( attempt * 15 ))
                continue
              fi

              echo "pip-audit reported findings in $manifest:" >&2
              cat audit.out >&2
              exit 1
            done

            echo "pip-audit could not reach PyPI for $manifest after 3 attempts:" >&2
            cat audit.out >&2
            exit 1
          done
