name: codeql

# Static security analysis (advanced setup, not the repo-settings "default
# setup" — the config lives here so it is reviewable in a diff like every
# other gate). Free on this public repository; findings land in the
# Security tab rather than turning the build red, so a new query shipping
# upstream cannot block an unrelated push.
#
# `push` fires on every branch and every path, unlike the other gates:
# Scorecard's SAST check asks whether a commit was analysed BEFORE it
# reached main. So a pull request from this repository is skipped, as its
# head's push already published `analyze (python)`, while a fork's pull
# request, whose head never pushes here, is analysed.
#
# The weekly cron is not redundant with push: CodeQL's query packs are
# updated continuously, and a new query only ever runs against code that
# has changed since it shipped. Without the cron, a rule published today
# would never be applied to a file last touched last year.

on:
  # No path filter: a skipped in-repo pull request needs this run's check.
  push:
  pull_request:
  schedule:
    # Wednesday 03:47 UTC. Off the hour and off Monday deliberately: the top
    # of the hour is when every cron on GitHub fires at once and jobs queue.
    - cron: '47 3 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    # A skipped job's name is published unevaluated, so its check never
    # takes the required `analyze (python)` name.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # Writing the analysis results is the whole point; everything else
      # stays read-only.
      security-events: write
      actions: read
      contents: read

    strategy:
      # `actions` for the workflows, `python` for the package; each lands
      # as its own check through the job name and `category:`.
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # `security-extended` over the default `security` pack: this code parses
          # untrusted transcript and config files off disk and builds paths
          # from their contents, which is what the extra precision-medium
          # queries are good at.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
