name: tests

# A matrix, because the tools read git history and paths on all three
# platforms: Windows spellings of a path, the /var -> /private/var aliasing
# macOS applies to temp dirs, and UTF-8 vs the ANSI code page all reach this
# code. Being verified only on whichever box last ran them by hand is the
# reason these moved into a public wheel.
#
# No install step: the tools are stdlib-only on purpose, so the suites can
# exercise the checkout directly on every supported platform.

on:
  push:
    branches: [main]
    # Deny-list rather than an allow-list: a new top-level code directory
    # would silently stop being tested under an allow-list.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

# Least privilege: this job only reads the tree. Without an explicit
# block it inherits the repository default, which can be read/write
# for the whole token.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in
          # .git/config lets any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run every git-coauthorship suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python run_tests.py

  wheel:
    # Proves the published artifact, not just the checkout: an import that
    # resolves only because the source tree is on sys.path would pass the
    # suites above and still ship a wheel whose commands do not exist.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # As in `suites`: nothing here pushes.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build the wheel
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m build --wheel --no-isolation

      - name: Install it with no checkout in reach and run every command
        run: |
          python -m venv "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/probe/bin/reauthor" --version
          "$RUNNER_TEMP/probe/bin/author-stats" --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: dist/*.whl

  coverage:
    # A JOB of its own, not steps in the matrix: coverage on every OS x
    # Python pair would report the same number each time. One run, on the
    # Python every single-interpreter job here pins, on the cheapest runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's merge commit and its first parent, the base it
          # merged: the changed-lines report below diffs exactly that pair.
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-diff-cover.txt

      - name: Install the coverage toolchain
        # git-filter-repo is what the end-to-end rewrite tests skip without,
        # so a missing one fails here rather than as a quietly lower number.
        run: |
          python -m pip install --require-hashes -r requirements-test.txt
          git filter-repo --version

      - name: Measure
        id: measure
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        # Each suite in its OWN subprocess, then combined, as run_tests.py
        # runs them: another execution shape would report coverage for a
        # program nobody runs. .coveragerc measures the tools the suites
        # start as child processes too. A failing suite does not fail this
        # job: the suites job above owns that verdict, and the gate below is
        # about how much code was reached.
        run: |
          shopt -s nullglob
          suites=(tests/test_*.py)
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "no suites found — refusing to report 0% as a pass" >&2
            exit 1
          fi
          failed=0
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            if ! python -m coverage run --rcfile=.coveragerc --parallel-mode --source=git_coauthorship "$suite"; then
              echo "  (suite did not pass; its coverage still counts)"
              failed=$(( failed + 1 ))
            fi
            echo "::endgroup::"
          done

          # A FAILING suite is fine here — the suites job above owns that
          # verdict, and a test that fails still executed the lines it
          # reached. Every suite failing is a different thing: it means
          # nothing ran, and the number below would describe no program at
          # all. That is not a low coverage result to gate on, it is a broken
          # job.
          if [ "$failed" -eq "${#suites[@]}" ]; then
            echo "every one of the ${#suites[@]} suites failed — refusing to" >&2
            echo "report a coverage number for a program that did not run." >&2
            exit 1
          fi

          python -m coverage combine

      - name: Coverage summary
        # Renders whether or not the gate below passes: a regression is
        # actionable only if you see WHICH file lost lines, and digging that
        # out of a scrolled CI log is the friction that gets a gate disabled.
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        run: |
          {
            echo '### Coverage'
            echo
            python -m coverage report --format=markdown --precision=1
          } >> "$GITHUB_STEP_SUMMARY"
          python -m coverage xml -o coverage.xml

      - name: Upload coverage.xml
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Coverage of changed lines (informational)
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' && github.event_name == 'pull_request' }}
        # Information only: no --fail-under, and continue-on-error keeps a
        # broken tool run from failing the job. HEAD^1 is the base this
        # merge commit was built on, however far the base branch has moved.
        continue-on-error: true
        run: |
          python -m pip install --require-hashes -r requirements-diff-cover.txt
          diff-cover coverage.xml --compare-branch=HEAD^1 --format "markdown:$RUNNER_TEMP/changed-lines.md"
          {
            echo '### Coverage of changed lines (informational)'
            echo
            cat "$RUNNER_TEMP/changed-lines.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage gate
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        # A RATCHET, not a target. The floor is committed data in
        # .github/ci-thresholds.json, and every green push to main raises it
        # to the measured total minus 1.5 through ratchet-push.yml; nothing
        # lowers it. An assignment's status is its substitution's, so an
        # unreadable record fails this step instead of gating on "".
        run: |
          floor="$(python .github/scripts/ratchet_thresholds.py floor .github/ci-thresholds.json)"
          python -m coverage report --fail-under="$floor" --precision=1

      - name: Stage a raised floor
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        # Read-only here: ratchet-push.yml commits the staged record once
        # this run is green. No artifact is the "no raise" answer.
        run: |
          out="$RUNNER_TEMP/ratchet-coverage"
          measured="$(python -m coverage report --format=total --precision=1)"
          python .github/scripts/ratchet_thresholds.py raise .github/ci-thresholds.json \
            --measured "$measured" --out-dir "$out"
          if [ -e "$out" ]; then
            git rev-parse HEAD > "$out/base.txt"
          fi

      - name: Upload the raised floor
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ratchet-coverage
          path: ${{ runner.temp }}/ratchet-coverage
          if-no-files-found: ignore
          retention-days: 1

  perf:
    # Instructions retired under callgrind, never wall time; perf_budget.py
    # says what is counted. The image is pinned because its libc and valgrind
    # are part of every count.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The raise check reads every commit since the base.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.14"

      - name: Install valgrind
        timeout-minutes: 5
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends valgrind
          valgrind --version

      - name: Refuse an undeclared budget raise
        env:
          GIT_COAUTHORSHIP_EVENT: ${{ github.event_name }}
          GIT_COAUTHORSHIP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GIT_COAUTHORSHIP_BEFORE_SHA: ${{ github.event.before }}
          GIT_COAUTHORSHIP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python .github/scripts/perf_budget_raise.py --event "$GIT_COAUTHORSHIP_EVENT" \
            --base "$GIT_COAUTHORSHIP_BASE_SHA" --before "$GIT_COAUTHORSHIP_BEFORE_SHA" --head "$GIT_COAUTHORSHIP_HEAD_SHA"

      - name: Measure
        id: measure
        run: python .github/scripts/perf_budget.py measure --work "$RUNNER_TEMP/perf" --out "$RUNNER_TEMP/perf-measurement.json"

      - name: Upload the measurement
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-measurement
          path: ${{ runner.temp }}/perf-measurement.json
          if-no-files-found: error

      - name: Check the counts against the budget
        run: |
          python .github/scripts/perf_budget.py check --budget .github/perf-budgets.json \
            --measurement "$RUNNER_TEMP/perf-measurement.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Stage a lowered budget
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          out="$RUNNER_TEMP/ratchet-perf"
          python .github/scripts/perf_budget.py tighten --budget .github/perf-budgets.json \
            --measurement "$RUNNER_TEMP/perf-measurement.json" --out-dir "$out"
          if [ -e "$out" ]; then
            git rev-parse HEAD > "$out/base.txt"
          fi

      - name: Upload the lowered budget
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ratchet-perf
          path: ${{ runner.temp }}/ratchet-perf
          if-no-files-found: ignore
          retention-days: 1
