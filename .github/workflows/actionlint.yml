name: actionlint

# The gate on the gates. Everything else in .github/workflows is unreviewed
# code that runs with a repository token, and a mistake in it fails in ways
# the other gates structurally cannot catch: a workflow with a typo in an
# `if:` expression does not go red, it silently stops running.
#
# Two tools, because they answer different questions:
#
#   actionlint — is this workflow WELL-FORMED? Schema, expression syntax,
#   context availability (`github.event.review` on a push event),
#   `runs-on` labels, and shellcheck over every `run:` block, which is where
#   most real bugs live.
#
#   zizmor — is this workflow SAFE? Script injection through `${{ }}` in a
#   `run:` block, over-broad `permissions:`, credential persistence after
#   checkout, unpinned action references.
#
# Both tools are pinned. actionlint is verified by checksum rather than
# trusted from the release page, because a linter that runs before every
# other gate is a supply-chain position worth defending.
#
# Suppressions belong at the offending line as a `# zizmor: ignore[rule]`
# comment WITH a justification, never as a raised --min-severity here: a
# threshold silences the next finding too, and the next one is the one
# nobody has thought about yet.

on:
  push:
    # Default branch only: a pull-request head already gets its run from
    # `pull_request`. No path filter, so a Markdown-only push to main is
    # checked too.
    branches: [main]
  pull_request:
    # No path filter: a check that reports on only some pull requests cannot
    # be required, since a required check that never reports blocks a merge.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push run is keyed by its SHA, so one push to main never cancels
  # another's; a pull request's newer head still cancels its older run.
  group: actionlint-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest

    env:
      # Nitjsefnie-OSC/actionlint, not stock rhysd/actionlint: upstream 1.7.12
      # plus rhysd/actionlint#654, which accepts the `queue: max` claim.yml
      # sets; stock 1.7.12 rejects that key. Return to upstream once a
      # release carries it.
      ACTIONLINT_VERSION: 1.7.12-queue.1
      # sha256 of actionlint_1.7.12-queue.1_linux_amd64.tar.gz, from the
      # release's own checksums file. Bump both together.
      ACTIONLINT_SHA256: dcc2c42a7caaa197dfe63584a3851f62ef260f80b2cf221baaf05479661e1521

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's own head (GitHub's test merge has main as a
          # parent); a push or dispatch checks out the event's commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history: the freshness and scope checks read main and the
          # pushed range, and a history read inherits the checkout's depth.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Run the .github/scripts suites
        # Before the steps below run those scripts.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Check no tracked file carries a merge-conflict marker
        # A marker in Markdown reads like prose, so only a mechanical check
        # sees it. The markers are matched in the shapes git writes them.
        run: bash .github/scripts/conflict_markers.sh

      - name: Require this head to carry main's gate-defining commits
        # Strict required checks are off, so a green head vouches only for
        # the tree it checked out; this compares that head with main.
        run: python3 .github/scripts/gate_base_freshness.py

      - name: Refuse a commit whose scope names a workflow outside the ci type
        # Only outgoing commits: a pull request or dispatch judges
        # origin/main..HEAD; a push to main judges the commits it adds,
        # before..HEAD, and refuses when there is no previous tip.
        env:
          GIT_COAUTHORSHIP_PUSH_BEFORE: ${{ github.event.before }}
        run: python3 .github/scripts/commit_scopes.py

      - name: Install actionlint
        # Downloaded and checksum-verified rather than piped from the
        # install script: `curl | bash` would make this job trust whatever
        # that URL serves at run time.
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/Nitjsefnie-OSC/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint --version

      - name: Install zizmor
        id: install_zizmor
        run: |
          python -m pip install --upgrade pip
          pip install zizmor==1.29.0

      - name: actionlint
        id: actionlint
        run: ./actionlint -color .github/workflows/*.yml

      - name: zizmor
        # Runs even when actionlint is red, so one push reports both gates.
        # Only if the install succeeded: the runner image ships no zizmor,
        # so the step could only fail.
        if: ${{ !cancelled() && steps.install_zizmor.outcome == 'success' }}
        env:
          # Enables the online audits (resolving action refs, checking for
          # known-vulnerable action versions). Read-only, and this workflow
          # declares contents: read.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/workflows/

      - name: Download gitleaks and verify its digest
        # Last: the checks above refuse in seconds. The digest is from the
        # release's checksums file; bump it with secrets.yml's copy.
        run: |
          tarball=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${tarball}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks

      - name: Scan the history for secrets
        # This job runs on every pull request and push to main, so requiring
        # its check gates merges. Bare: a leak exits nonzero. A failed git
        # walk is not a leak: gitleaks reports 0 commits and exits 0.
        # Bounded to HEAD: fetch-depth 0 fetched every branch, and another
        # branch's leak is not this head's; secrets.yml scans them daily.
        run: ./gitleaks detect --verbose --redact --log-opts='--full-history --diff-filter=tuxdb HEAD'
