name: tag

# Creates the tag that release.yml consumes.
#
# Once a `v*` tag exists, release.yml runs every suite, builds the wheel and
# publishes SHA256SUMS beside it, but it cannot know WHEN: a tag forgotten
# after a __version__ bump is a bump that never ships.
#
# So this tags the version and then STARTS release.yml by hand: a tag pushed
# with GITHUB_TOKEN triggers no workflow (GitHub suppresses runs from
# token-authored events so a workflow cannot loop on its own pushes), and
# `workflow_dispatch` is a documented exception. Without the dispatch the
# tag lands, the version looks shipped, no release is cut, and nothing goes
# red.
#
# It waits for the other gates first. A tag outlives a mistake: a branch
# can be force-pushed, but a release someone has pulled cannot be
# unpublished. release.yml re-runs the suites, but would not catch a lint or
# type regression.
#
# It runs on every push the gates run on, so a bump whose own commit is red
# is tagged by whichever later commit (usually touching other files) turns
# main green. A push leaving an already-tagged version unchanged ends green
# before the wait. Re-running a bump commit's failed gates creates no push,
# so no run. A bump whose run went red on checks a newer push cancelled is
# tagged at the newer tip by that push's run, once its checks pass; to tag
# the bump commit itself while untagged, re-run its gates green, then
# dispatch with its `sha`.

on:
  push:
    branches: [main]
    # The gates' own ignore list: a push they skip has no check runs, and
    # the wait would time out red.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to tag (default: the branch tip)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # NOT cancel-in-progress: unlike a test run, a superseded tag run may be
  # midway through creating a tag. Under the default `queue: single` a
  # newer run does cancel a PENDING one (grey, not red) and judges the newer
  # tip itself.
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      # Pushing the tag; release.yml holds its own for the release.
      contents: write
      # Reading the other workflows' results for this SHA.
      checks: read
      # Dispatching release.yml (the header says why).
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          # This job DOES push (the tag), so it keeps the token.
          persist-credentials: true

      - name: Read and validate the version
        id: version
        # Imported, not grepped: pyproject.toml resolves the wheel's version
        # from this attribute, so the tag and the wheel agree.
        run: |
          version="$(python3 -c 'import git_coauthorship; print(git_coauthorship.__version__)')"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([._a-z0-9-]*)$'; then
            echo "__version__ is not a usable version: '$version'" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Version is $version"

      - name: Refuse to re-tag an existing version
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
          # The branch tip before this push; empty on a dispatch.
          BEFORE: ${{ github.event.before }}
        # An existing tag on a push that left __version__ unchanged means it
        # shipped: green here, later steps skip. Any other existing tag (a
        # push that set a shipped version, a dispatch) is a mistaken edit or
        # a rerun after a partial failure: it ends red for a human, as a
        # no-op here would be silent. An unreadable before-push version ends
        # red with its own message, as the job cannot tell which case it is.
        #
        # gh exits alike on a 404 and any other failure, so `--include` puts
        # the status line first: only a 404 means free; other failures end
        # red.
        #
        # The checkout is one commit deep and a push can carry any number of
        # commits, so the before-push commit is fetched by SHA, as
        # actions/checkout fetched this one.
        run: |
          gh_status=0
          response="$(gh api --include -H "Cache-Control: no-cache" \
            "repos/$REPO/git/ref/tags/$TAG")" || gh_status=$?
          read -r _ http_status _ <<< "${response%%$'\n'*}"
          if [ "$gh_status" -ne 0 ]; then
            if [ "$http_status" = 404 ]; then
              echo "$TAG is free"
              exit 0
            fi
            echo "Could not tell whether $TAG exists (HTTP ${http_status:-none})." >&2
            exit 1
          fi

          # Read the same way as the version step: import the attribute, here
          # from the before-push commit's tree.
          version_at() {
            git fetch --no-tags --depth=1 origin "$1" >&2 &&
              git archive -o "$RUNNER_TEMP/before.tar" "$1" git_coauthorship &&
              mkdir "$RUNNER_TEMP/before" &&
              tar -xf "$RUNNER_TEMP/before.tar" -C "$RUNNER_TEMP/before" &&
              (cd "$RUNNER_TEMP/before" &&
                python3 -c 'import git_coauthorship; print(git_coauthorship.__version__)')
          }
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if ! before="$(version_at "$BEFORE")"; then
              echo "Tag $TAG already exists, and __version__ could not be read at" >&2
              echo "$BEFORE, the commit this push started from, so there is no" >&2
              echo "telling whether this push re-set a version that has shipped." >&2
              exit 1
            fi
            if [ "v$before" = "$TAG" ]; then
              echo "$TAG already shipped and this push left __version__ unchanged;"
              echo "nothing to tag."
              echo "shipped=true" >> "$GITHUB_OUTPUT"
              echo "\`$TAG\` already shipped; this push left \`__version__\` unchanged." \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo "Tag $TAG already exists — __version__ was set to a version" >&2
          echo "that has already shipped. Bump it further, or delete that" >&2
          echo "tag and its release if it was cut in error." >&2
          exit 1

      - name: Wait for the other gates on this commit
        # This and the two steps after it skip on an already-shipped version.
        if: steps.existing.outputs.shipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
          REPO: ${{ github.repository }}
        # It excludes ITSELF (or it waits on itself); it needs at least one
        # other check, so it cannot tag before CI is scheduled; `cancelled`
        # counts as failure: a newer push superseded this SHA, which is not a
        # commit to release.
        run: |
          deadline=$(( SECONDS + 45 * 60 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh api --paginate \
              -H "Cache-Control: no-cache" \
              "repos/$REPO/commits/$SHA/check-runs" \
              --jq '.check_runs[] | select(.name | startswith("tag") | not)
                    | "\(.status)\t\(.conclusion)\t\(.name)"')"

            if [ -z "$runs" ]; then
              echo "no other check runs reported yet, waiting..."
              sleep 20
              continue
            fi

            pending="$(echo "$runs" | grep -cv '^completed' || true)"
            if [ "$pending" -gt 0 ]; then
              echo "$pending check(s) still running:"
              echo "$runs" | grep -v '^completed' | awk '{print "    " $0}'
              sleep 20
              continue
            fi

            echo "All checks completed:"
            echo "$runs" | awk '{print "    " $0}'
            bad="$(echo "$runs" \
              | awk -F'\t' '$2 != "success" && $2 != "skipped" && $2 != "neutral"')"
            if [ -n "$bad" ]; then
              echo "Refusing to tag: these checks did not pass:" >&2
              echo "$bad" | awk '{print "    " $0}' >&2
              exit 1
            fi
            echo "Every check passed — proceeding."
            exit 0
          done
          echo "Timed out after 45 minutes waiting for checks on $SHA" >&2
          exit 1

      - name: Create and push the tag
        if: steps.existing.outputs.shipped != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ inputs.sha || github.sha }}
        # Annotated, not lightweight: it records who created it and when.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$SHA"
          git push origin "$TAG"
          echo "Pushed $TAG at $SHA."
          {
            echo "### Tagged \`$TAG\`"
            echo
            echo "Commit \`$SHA\`, after every check on it passed."
            echo "\`release.yml\` builds and publishes the wheel from here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start the release
        if: steps.existing.outputs.shipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        # release.yml's `push: tags: v*` fires for a tag a HUMAN pushes, not
        # for this GITHUB_TOKEN push. Firing twice is harmless: release.yml
        # replaces an existing release's assets rather than failing.
        run: |
          gh workflow run release.yml --repo "$REPO" --ref "$TAG"
          echo "Dispatched release.yml against $TAG."
          {
            echo "\`release.yml\` dispatched against \`$TAG\`; it builds"
            echo "and publishes the wheel and its checksums from there."
          } >> "$GITHUB_STEP_SUMMARY"
