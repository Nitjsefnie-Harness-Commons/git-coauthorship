name: tag

# Creates the tag that release.yml consumes.
#
# release.yml already does the right thing once a `v*` tag exists: it runs
# every suite, builds the wheel, and publishes SHA256SUMS beside it. What it
# has no way to know is WHEN to fire — someone has to remember to push a tag
# after bumping __version__, and a forgotten tag means a version bump that
# never ships.
#
# So this composes with it rather than replacing it: it reads the version on
# every push to main that the gates run on, pushes the tag, and then STARTS
# release.yml by hand. That last part is not belt-and-braces: a `v*` tag pushed with the
# built-in GITHUB_TOKEN does not trigger release.yml at all. GitHub suppresses
# workflow runs from token-authored events so a workflow cannot loop on its
# own pushes, and `workflow_dispatch` is one of the two documented exceptions
# to that rule -- which is why the last step below dispatches rather than
# relying on the push.
#
# Without it the failure is silent and total: the tag lands, the version looks
# shipped, no release is ever cut, and nothing goes red.
#
# release.yml re-runs the suites itself before publishing anything, so the
# publish path keeps its own safety net regardless of what happened here.
#
# It still waits for the other gates first. A tag is the one artefact that
# outlives a mistake — a branch can be force-pushed, but a release someone
# has pulled cannot be unpublished — so tagging a red commit is worth
# preventing even though release.yml would catch a failing suite later. It
# would NOT catch a lint or type regression, which never reach that job.
#
# Every push the gates run on, not only one that edits __version__: a bump
# whose own commit is red must still be tagged by whichever later commit
# turns main green, and that commit usually touches other files. A push
# that leaves an already-tagged version unchanged ends green at the
# existing-tag step, before the wait, with nothing tagged or dispatched.
# Neither re-running the bump commit's failed gates (no push, so no run) nor
# an untagged bump's push whose run went red on checks a newer push
# cancelled tags that commit: dispatch this workflow with its `sha` input.

on:
  push:
    branches: [main]
    # The gate workflows' own ignore list: on a push they skip, no check
    # run exists for the commit, and the wait below would time out red.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to tag (default: the branch tip)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # NOT cancel-in-progress: a superseded test run teaches you nothing and is
  # worth cancelling; a superseded tag run may be midway through creating a
  # tag. A PENDING run is another matter: under the default `queue: single`
  # GitHub keeps one pending run per group, so a newer run cancels it (grey,
  # not red), and the newer run judges the newer tip.
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      # Creating the tag. release.yml holds its own write permission for the
      # release itself.
      contents: write
      # Reading the other workflows' results for this SHA.
      checks: read
      # Dispatching release.yml. See the last step for why the tag push
      # cannot do that on its own.
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          # This job DOES push (the tag), so it keeps the token.
          persist-credentials: true

      - name: Read and validate the version
        id: version
        # Read from the installed attribute rather than grepped out of the
        # file: pyproject.toml resolves the distribution version from this
        # same attribute, so reading it the same way is the only way to be
        # sure the tag and the wheel agree.
        run: |
          version="$(python3 -c 'import git_coauthorship; print(git_coauthorship.__version__)')"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([._a-z0-9-]*)$'; then
            echo "__version__ is not a usable version: '$version'" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Version is $version"

      - name: Refuse to re-tag an existing version
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
          # The branch tip before this push; empty on a dispatch.
          BEFORE: ${{ github.event.before }}
        # On a push that left __version__ unchanged, an existing tag means
        # that version already shipped: the job ends green here and every
        # later step skips. Any other existing tag (a push that set an
        # already-shipped version, a dispatch) is a mistaken edit or a rerun
        # after a partial failure. Both want a human, and both are silent if
        # this step is a no-op instead of an error. A before-push version
        # that cannot be read ends red too, with its own message: the job
        # cannot tell which of those cases it is in.
        #
        # gh's exit status is the same for a 404 as for any other failure, so
        # `--include` puts the HTTP status line first: only a 404 means the
        # tag is free, and any other failed lookup ends red rather than
        # guessing either way.
        #
        # The checkout is one commit deep, so the before-push commit is
        # fetched by SHA, as actions/checkout fetched this one. No fetch depth
        # could promise to reach it: one push can carry any number of commits.
        run: |
          gh_status=0
          response="$(gh api --include -H "Cache-Control: no-cache" \
            "repos/$REPO/git/ref/tags/$TAG")" || gh_status=$?
          read -r _ http_status _ <<< "${response%%$'\n'*}"
          if [ "$gh_status" -ne 0 ]; then
            if [ "$http_status" = 404 ]; then
              echo "$TAG is free"
              exit 0
            fi
            echo "Could not tell whether $TAG exists (HTTP ${http_status:-none})." >&2
            exit 1
          fi

          # Read the same way as the version step: import the attribute, here
          # from the before-push commit's tree.
          version_at() {
            git fetch --no-tags --depth=1 origin "$1" >&2 &&
              git archive -o "$RUNNER_TEMP/before.tar" "$1" git_coauthorship &&
              mkdir "$RUNNER_TEMP/before" &&
              tar -xf "$RUNNER_TEMP/before.tar" -C "$RUNNER_TEMP/before" &&
              (cd "$RUNNER_TEMP/before" &&
                python3 -c 'import git_coauthorship; print(git_coauthorship.__version__)')
          }
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if ! before="$(version_at "$BEFORE")"; then
              echo "Tag $TAG already exists, and __version__ could not be read at" >&2
              echo "$BEFORE, the commit this push started from, so there is no" >&2
              echo "telling whether this push re-set a version that has shipped." >&2
              exit 1
            fi
            if [ "v$before" = "$TAG" ]; then
              echo "$TAG already shipped and this push left __version__ unchanged;"
              echo "nothing to tag."
              echo "shipped=true" >> "$GITHUB_OUTPUT"
              echo "\`$TAG\` already shipped; this push left \`__version__\` unchanged." \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo "Tag $TAG already exists — __version__ was set to a version" >&2
          echo "that has already shipped. Bump it further, or delete that" >&2
          echo "tag and its release if it was cut in error." >&2
          exit 1

      - name: Wait for the other gates on this commit
        # This and the two steps after it skip on an already-shipped version.
        if: steps.existing.outputs.shipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
          REPO: ${{ github.repository }}
        # Three details that are each a way this can be wrong:
        #   - it excludes ITSELF, or it would wait on a job waiting on it;
        #   - it requires at least one other check to exist, so it cannot
        #     race ahead and tag before CI has even been scheduled;
        #   - `cancelled` counts as failure. A cancelled run means a newer
        #     push superseded this SHA, which is not a commit to release.
        run: |
          deadline=$(( SECONDS + 45 * 60 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh api --paginate \
              -H "Cache-Control: no-cache" \
              "repos/$REPO/commits/$SHA/check-runs" \
              --jq '.check_runs[] | select(.name | startswith("tag") | not)
                    | "\(.status)\t\(.conclusion)\t\(.name)"')"

            if [ -z "$runs" ]; then
              echo "no other check runs reported yet, waiting..."
              sleep 20
              continue
            fi

            pending="$(echo "$runs" | grep -cv '^completed' || true)"
            if [ "$pending" -gt 0 ]; then
              echo "$pending check(s) still running:"
              echo "$runs" | grep -v '^completed' | awk '{print "    " $0}'
              sleep 20
              continue
            fi

            echo "All checks completed:"
            echo "$runs" | awk '{print "    " $0}'
            bad="$(echo "$runs" \
              | awk -F'\t' '$2 != "success" && $2 != "skipped" && $2 != "neutral"')"
            if [ -n "$bad" ]; then
              echo "Refusing to tag: these checks did not pass:" >&2
              echo "$bad" | awk '{print "    " $0}' >&2
              exit 1
            fi
            echo "Every check passed — proceeding."
            exit 0
          done
          echo "Timed out after 45 minutes waiting for checks on $SHA" >&2
          exit 1

      - name: Create and push the tag
        if: steps.existing.outputs.shipped != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ inputs.sha || github.sha }}
        # An annotated tag, not lightweight: it records who created it and
        # when, which a lightweight tag does not.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$SHA"
          git push origin "$TAG"
          echo "Pushed $TAG at $SHA."
          {
            echo "### Tagged \`$TAG\`"
            echo
            echo "Commit \`$SHA\`, after every check on it passed."
            echo "\`release.yml\` builds and publishes the wheel from here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start the release
        if: steps.existing.outputs.shipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        # release.yml also triggers on `push: tags: v*`, and that trigger
        # is what fires for a tag a HUMAN pushes. It does not fire for the
        # tag the step above just pushed, because that push was
        # authenticated with GITHUB_TOKEN. Dispatching is the documented
        # way through, and it composes safely with the push trigger:
        # release.yml replaces the assets on a release that already exists
        # rather than failing, so firing twice is not a problem.
        run: |
          gh workflow run release.yml --repo "$REPO" --ref "$TAG"
          echo "Dispatched release.yml against $TAG."
          {
            echo "\`release.yml\` dispatched against \`$TAG\`; it builds"
            echo "and publishes the wheel and its checksums from there."
          } >> "$GITHUB_STEP_SUMMARY"
